name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[dev]"
      - name: unit tests
        # Unrelated packages can register broken pytest plugins; none are needed.
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
        run: pytest -q

  # The standard-only build and the diagram check are network- and
  # version-independent, so they run once rather than once per interpreter.
  # isobus.net is a single free server: four jobs re-downloading the same
  # 323 KB on every push is both fragile and rude, and it is what made the
  # first run fail.
  standard-only:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"

      - name: cache the published parameter export
        uses: actions/cache@v4
        with:
          path: ~/.cache/dbcgen
          key: isobus-export-v1

      - name: a database builds from the standard alone, with no recording
        # The primary mode. It must not quietly start depending on a recording.
        run: |
          python -m dbcgen.cli fetch-standard
          python -m dbcgen.cli generate -o /tmp/standard.dbc
          python -c "import cantools, sys; d = cantools.database.load_file('/tmp/standard.dbc'); print(len(d.messages), 'messages'); sys.exit(0 if len(d.messages) > 50 else 1)"

      - name: every catalogued source builds a loadable database
        # Each is a different upstream format fetched from a different host, and
        # generate reloads what it writes. A source that stops parsing fails
        # here rather than the first time a user picks it off the menu.
        run: |
          python -m dbcgen.cli sources
          python -m dbcgen.cli generate --source obd2     -o /tmp/obd2.dbc
          python -m dbcgen.cli generate --source nmea2000 -o /tmp/nmea.dbc
          python -m dbcgen.cli generate --source opendbc:acura_ilx_2016_nidec -o /tmp/acura.dbc

      - name: the annex reader reproduces the dedicated parser
        # No licensed annex exists here to test against, so the check is that
        # header-sniffing reads the free export exactly as the parser written
        # for it does. Same shape of table, known-correct answers.
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
        run: pytest -q tests/test_annex.py

      - name: the committed diagrams still match their generator
        run: |
          python docs/make_workflow.py
          git diff --exit-code -- docs/figures

  benchmark:
    # Runs after standard-only rather than beside it: both need the same export,
    # and two concurrent requests are what the server refused.  By this point
    # the cache is warm, so this job normally makes no network request at all.
    needs: standard-only
    # The measured numbers in the README come from here, against public
    # reference DBCs. A drop in accuracy fails the build rather than sitting
    # unnoticed in a table.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - name: cache the published parameter export
        uses: actions/cache@v4
        with:
          path: ~/.cache/dbcgen
          key: isobus-export-v1
      - name: fetch the published parameter database
        run: python -m dbcgen.cli fetch-standard
      - name: score against public reference DBCs
        run: python -m benchmarks.run --json benchmarks/out/scores.json
      - name: regenerate the README figure
        run: python docs/make_figures.py
      - uses: actions/upload-artifact@v4
        with:
          name: benchmark
          path: |
            benchmarks/out/scores.json
            docs/figures/segmentation.png
