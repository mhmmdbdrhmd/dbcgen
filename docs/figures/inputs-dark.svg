<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="470" viewBox="0 0 1000 470" role="img"><defs><marker id="head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#9198A1"/></marker><marker id="head-std" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2DD4BF"/></marker><marker id="head-inf" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#F0883E"/></marker><marker id="head-out" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#A371F7"/></marker><marker id="head-hw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#58A6FF"/></marker></defs><rect width="1000" height="470" fill="#0D1117"/><text x="500.0" y="30" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="16" font-weight="600" fill="#E6EDF3" text-anchor="middle">What you get with the standard alone, and what a recording adds</text><rect x="40" y="56" width="450" height="92" rx="10" ry="10" fill="#151B23" stroke="#2DD4BF" stroke-width="2"/><text x="62" y="84" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="15" font-weight="600" fill="#E6EDF3" text-anchor="start">Standard only</text><text x="62" y="108" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace" font-size="11.5" font-weight="400" fill="#2DD4BF" text-anchor="start">dbcgen generate -o bus.dbc</text><text x="62" y="132" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#9198A1" text-anchor="start">No hardware, no bus, no machine. Run it on a train.</text><rect x="510" y="56" width="450" height="92" rx="10" ry="10" fill="#151B23" stroke="#F0883E" stroke-width="2"/><text x="532" y="84" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="15" font-weight="600" fill="#E6EDF3" text-anchor="start">Standard + recording</text><text x="532" y="108" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace" font-size="11.5" font-weight="400" fill="#F0883E" text-anchor="start">dbcgen generate rec.csv -o bus.dbc</text><text x="532" y="132" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#9198A1" text-anchor="start">Everything on the left, plus everything below.</text><circle cx="70" cy="182" r="4.5" fill="#2DD4BF"/><text x="88" y="180" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12.5" font-weight="600" fill="#E6EDF3" text-anchor="start">100 messages, 612 signals</text><text x="88" y="197" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#9198A1" text-anchor="start">every group whose layout the standard publishes</text><circle cx="70" cy="228" r="4.5" fill="#2DD4BF"/><text x="88" y="226" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12.5" font-weight="600" fill="#E6EDF3" text-anchor="start">Real names, scales, units</text><text x="88" y="243" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#9198A1" text-anchor="start">EstimatedCurvature, 0.25 km-1/bit, offset -8032</text><circle cx="70" cy="274" r="4.5" fill="#2DD4BF"/><text x="88" y="272" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12.5" font-weight="600" fill="#E6EDF3" text-anchor="start">Address claim, request, transport, DM1</text><text x="88" y="289" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#9198A1" text-anchor="start">the network-layer groups every J1939 bus carries</text><circle cx="70" cy="320" r="4.5" fill="#2DD4BF"/><text x="88" y="318" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12.5" font-weight="600" fill="#E6EDF3" text-anchor="start">Nothing is guessed</text><text x="88" y="335" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#9198A1" text-anchor="start">every signal is marked standard; none is inferred</text><circle cx="540" cy="182" r="4.5" fill="#F0883E"/><text x="558" y="180" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12.5" font-weight="600" fill="#E6EDF3" text-anchor="start">Only what your machine sends</text><text x="558" y="197" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#9198A1" text-anchor="start">the ids that machine sends, not 3213 in the registry</text><circle cx="540" cy="228" r="4.5" fill="#F0883E"/><text x="558" y="226" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12.5" font-weight="600" fill="#E6EDF3" text-anchor="start">Real source addresses and senders</text><text x="558" y="243" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#9198A1" text-anchor="start">read out of the 64-bit NAME in each address claim</text><circle cx="540" cy="274" r="4.5" fill="#F0883E"/><text x="558" y="272" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12.5" font-weight="600" fill="#E6EDF3" text-anchor="start">Measured cycle times</text><text x="558" y="289" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#9198A1" text-anchor="start">median inter-arrival, suppressed for event traffic</text><circle cx="540" cy="320" r="4.5" fill="#F0883E"/><text x="558" y="318" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12.5" font-weight="600" fill="#E6EDF3" text-anchor="start">Structure where the standard has none</text><text x="558" y="335" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#9198A1" text-anchor="start">name-only groups and proprietary ids, from flip rates</text><circle cx="540" cy="366" r="4.5" fill="#F0883E"/><text x="558" y="364" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12.5" font-weight="600" fill="#E6EDF3" text-anchor="start">Which signals carry data at all</text><text x="558" y="381" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#9198A1" text-anchor="start">a field stuck at the not-available code is visible</text><rect x="40" y="396" width="920" height="54" rx="8" ry="8" fill="#151B23" stroke="#3D444D" stroke-width="1.2"/><text x="62" y="420" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#9198A1" text-anchor="start">A signal that never moved during the recording cannot be located by any method, by this tool or any other.</text><text x="62" y="438" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#9198A1" text-anchor="start">That is why every accuracy figure here is quoted twice: against all reference signals, and against the ones that actually moved.</text></svg>