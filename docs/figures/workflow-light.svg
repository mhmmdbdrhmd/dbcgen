<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="570" viewBox="0 0 1000 570" role="img"><defs><marker id="head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#59636E"/></marker><marker id="head-std" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#0D9488"/></marker><marker id="head-inf" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#C2410C"/></marker><marker id="head-out" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#6E40C9"/></marker><marker id="head-hw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#1F6FEB"/></marker></defs><rect width="1000" height="570" fill="#FFFFFF"/><text x="500.0" y="30" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="16" font-weight="600" fill="#1F2328" text-anchor="middle">How a database gets made, and what it is for</text><rect x="30" y="62" width="292" height="118" rx="10" ry="10" fill="#F6F8FA" stroke="#0D9488" stroke-width="1.5"/><text x="50" y="86" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="10.5" font-weight="700" fill="#0D9488" text-anchor="start" letter-spacing="1.4">ALWAYS AVAILABLE</text><text x="50" y="110" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14.5" font-weight="600" fill="#1F2328" text-anchor="start">1  The published standard</text><text x="50" y="132" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#59636E" text-anchor="start">isobus.net export, ~320 KB, no</text><text x="50" y="148" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#59636E" text-anchor="start">account and no licence needed.</text><text x="50" y="169" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace" font-size="11.5" font-weight="400" fill="#0D9488" text-anchor="start">dbcgen fetch-standard</text><rect x="30" y="200" width="292" height="152" rx="10" ry="10" fill="#F6F8FA" stroke="#1F6FEB" stroke-width="1.5" stroke-dasharray="6 5"/><text x="50" y="224" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="10.5" font-weight="700" fill="#1F6FEB" text-anchor="start" letter-spacing="1.4">OPTIONAL — AND WHERE</text><text x="50" y="238" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="10.5" font-weight="700" fill="#1F6FEB" text-anchor="start" letter-spacing="1.4">THE REAL GAINS ARE</text><text x="50" y="262" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14.5" font-weight="600" fill="#1F2328" text-anchor="start">2  A recording of your bus</text><text x="50" y="284" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#59636E" text-anchor="start">can-logger-esp32 with NO frame</text><text x="50" y="300" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#59636E" text-anchor="start">map on the card, so every frame</text><text x="50" y="316" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#59636E" text-anchor="start">keeps its raw payload bytes.</text><text x="50" y="338" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace" font-size="11.5" font-weight="400" fill="#1F6FEB" text-anchor="start">t_us;0xID;;;;;HEX</text><rect x="372" y="62" width="282" height="290" rx="10" ry="10" fill="#EEF1F4" stroke="#D1D9E0" stroke-width="1.5"/><text x="513.0" y="88" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14.5" font-weight="600" fill="#1F2328" text-anchor="middle">3  dbcgen generate</text><text x="513.0" y="107" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#818B98" text-anchor="middle">four layers, highest authority first</text><rect x="388" y="124" width="250" height="48" rx="7" ry="7" fill="#F6F8FA" stroke="#0D9488" stroke-width="1.2"/><text x="400" y="144" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12.5" font-weight="600" fill="#1F2328" text-anchor="start">Network layer</text><text x="400" y="161" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="10.5" font-weight="400" fill="#59636E" text-anchor="start">J1939-21 / -73 / -81</text><text x="626" y="144" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="9.5" font-weight="700" fill="#0D9488" text-anchor="end">standard</text><rect x="388" y="180" width="250" height="48" rx="7" ry="7" fill="#F6F8FA" stroke="#0D9488" stroke-width="1.2"/><text x="400" y="200" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12.5" font-weight="600" fill="#1F2328" text-anchor="start">Published layout</text><text x="400" y="217" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="10.5" font-weight="400" fill="#59636E" text-anchor="start">ISO 11783 bit positions</text><text x="626" y="200" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="9.5" font-weight="700" fill="#0D9488" text-anchor="end">standard</text><rect x="388" y="236" width="250" height="48" rx="7" ry="7" fill="#F6F8FA" stroke="#C2410C" stroke-width="1.2" stroke-dasharray="6 5"/><text x="400" y="256" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12.5" font-weight="600" fill="#1F2328" text-anchor="start">Flip-rate inference</text><text x="400" y="273" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="10.5" font-weight="400" fill="#59636E" text-anchor="start">field edges out of the bytes</text><text x="626" y="256" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="9.5" font-weight="700" fill="#C2410C" text-anchor="end">recorded</text><rect x="388" y="292" width="250" height="48" rx="7" ry="7" fill="#F6F8FA" stroke="#C2410C" stroke-width="1.2" stroke-dasharray="6 5"/><text x="400" y="312" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12.5" font-weight="600" fill="#1F2328" text-anchor="start">Raw byte passthrough</text><text x="400" y="329" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="10.5" font-weight="400" fill="#59636E" text-anchor="start">no byte on the bus is lost</text><text x="626" y="312" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="9.5" font-weight="700" fill="#C2410C" text-anchor="end">recorded</text><line x1="322" y1="121" x2="364" y2="150" stroke="#0D9488" stroke-width="2" stroke-linecap="round" marker-end="url(#head-std)"/><line x1="322" y1="285" x2="364" y2="264" stroke="#1F6FEB" stroke-width="2" stroke-linecap="round" stroke-dasharray="6 5" marker-end="url(#head-hw)"/><rect x="690" y="118" width="280" height="152" rx="10" ry="10" fill="#F6F8FA" stroke="#6E40C9" stroke-width="2"/><text x="710" y="142" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="10.5" font-weight="700" fill="#6E40C9" text-anchor="start" letter-spacing="1.4">THE DELIVERABLE</text><text x="710" y="168" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="15" font-weight="600" fill="#1F2328" text-anchor="start">4  bus.dbc</text><text x="710" y="192" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#59636E" text-anchor="start">Every signal names its own origin,</text><text x="710" y="208" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#59636E" text-anchor="start">so a documented definition is never</text><text x="710" y="224" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#59636E" text-anchor="start">mistaken for a measured guess.</text><text x="710" y="248" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace" font-size="10.5" font-weight="400" fill="#6E40C9" text-anchor="start">reloaded, then re-decoded</text><line x1="662" y1="194" x2="680" y2="194" stroke="#6E40C9" stroke-width="2" stroke-linecap="round" marker-end="url(#head-out)"/><text x="690" y="312" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13.5" font-weight="600" fill="#1F2328" text-anchor="start">5  Point a tool at it</text><rect x="690" y="330" width="280" height="42" rx="7" ry="7" fill="#F6F8FA" stroke="#D1D9E0" stroke-width="1.2"/><text x="704" y="348" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace" font-size="11.5" font-weight="400" fill="#1F2328" text-anchor="start">can-logger-esp32</text><text x="704" y="363" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="9.5" font-weight="400" fill="#818B98" text-anchor="start">copy to the SD card as /frames.dbc</text><rect x="690" y="380" width="280" height="42" rx="7" ry="7" fill="#F6F8FA" stroke="#D1D9E0" stroke-width="1.2"/><text x="704" y="398" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace" font-size="11.5" font-weight="400" fill="#1F2328" text-anchor="start">SavvyCAN / CANalyzer</text><text x="704" y="413" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="9.5" font-weight="400" fill="#818B98" text-anchor="start">open a trace with real signal names</text><rect x="690" y="430" width="280" height="42" rx="7" ry="7" fill="#F6F8FA" stroke="#D1D9E0" stroke-width="1.2"/><text x="704" y="448" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace" font-size="11.5" font-weight="400" fill="#1F2328" text-anchor="start">cantools / pandas</text><text x="704" y="463" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="9.5" font-weight="400" fill="#818B98" text-anchor="start">decode a log into a dataframe</text><path d="M 830.0 270 L 830.0 322" fill="none" stroke="#6E40C9" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#head-out)"/><path d="M 690 351 C 600 351, 600 512, 470 512 L 176 512 L 176 360" fill="none" stroke="#1F6FEB" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="6 5" marker-end="url(#head-hw)"/><text x="206" y="470" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#818B98" text-anchor="start">The logger now writes named signals in engineering units,</text><text x="206" y="486" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#818B98" text-anchor="start">and the next recording is better evidence than the last.</text></svg>